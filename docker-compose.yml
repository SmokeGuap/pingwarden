services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pingwarden
      POSTGRES_PASSWORD: pingwarden
      POSTGRES_DB: pingwarden
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pingwarden"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgres://pingwarden:pingwarden@postgres:5432/pingwarden?sslmode=disable
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

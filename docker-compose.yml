x-env: &env
  DATABASE_URL: postgres://pingwarden:pingwarden@postgres:5432/pingwarden?sslmode=disable
  REDIS_ADDR: redis:6379

x-app: &app
  image: pingwarden:dev
  build: .
  environment: *env

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pingwarden
      POSTGRES_PASSWORD: pingwarden
      POSTGRES_DB: pingwarden
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pingwarden"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    command: ["/app/migrate"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    command: ["/app/api"]
    environment:
      <<: *env
      API_TOKEN: ${API_TOKEN}
    ports: ["8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  scheduler:
    <<: *app
    command: ["/app/scheduler"]
    depends_on: &after_migrate
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    <<: *app
    command: ["/app/worker"]
    depends_on: *after_migrate

  notifier:
    <<: *app
    command: ["/app/notifier"]
    environment:
      <<: *env
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    depends_on:
      redis: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v3.0.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    ports: ["9090:9090"]

volumes:
  pgdata:

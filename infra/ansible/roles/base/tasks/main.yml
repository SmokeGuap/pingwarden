- name: Install base packages
  ansible.builtin.apt:
    name: [ufw, fail2ban, unattended-upgrades, curl, ca-certificates]
    update_cache: true
    cache_valid_time: 3600

- name: Create deploy user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    groups: sudo
    append: true

- name: Authorize SSH key
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ lookup('file', deploy_ssh_pubkey_file) }}"

- name: Passwordless sudo for deploy user
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ deploy_user }}"
    content: "{{ deploy_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Harden sshd
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Allow SSH, HTTP, HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["22", "80", "443"]

- name: Allow k3s pod and service networks
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
  loop: ["10.42.0.0/16", "10.43.0.0/16"]

- name: Enable ufw (deny incoming by default)
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Enable fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: Create swapfile
  ansible.builtin.command: "fallocate -l {{ swap_size }} /swapfile"
  args:
    creates: /swapfile
  register: swap_file

- name: Restrict swapfile permissions
  ansible.builtin.file:
    path: /swapfile
    mode: "0600"

- name: Format and enable swap
  ansible.builtin.shell: mkswap /swapfile && swapon /swapfile
  when: swap_file.changed

- name: Persist swap in fstab
  ansible.posix.mount:
    path: none
    src: /swapfile
    fstype: swap
    opts: sw
    state: present

- name: Prefer RAM over swap
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
    state: present

groups:
  - name: pingwarden
    rules:
      - alert: WorkerDown
        expr: absent(up{job="worker"} == 1)
        for: 1m
        annotations:
          summary: "No healthy workers"

      - alert: ChecksStalled
        expr: sum(rate(pingwarden_checks_total[5m])) == 0 and sum(pingwarden_checks) > 0
        for: 5m
        annotations:
          summary: "Checks are configured but none are being executed"

      - alert: ApiHighErrorRate
        expr: >
          sum(rate(pingwarden_http_requests_total{status=~"5.."}[5m]))
          / sum(rate(pingwarden_http_requests_total[5m])) > 0.05
        for: 5m
        annotations:
          summary: "More than 5% of API requests fail with 5xx"

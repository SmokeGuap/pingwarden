global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:9090"]

  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9090

  - job_name: scheduler
    static_configs:
      - targets: ["scheduler:9090"]

  - job_name: notifier
    static_configs:
      - targets: ["notifier:9090"]

groups:
  - name: pingwarden-service
    rules:
      - alert: WorkerDown
        expr: absent(up{job="worker"} == 1)
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "No healthy workers"

      - alert: ChecksStalled
        expr: sum(rate(pingwarden_checks_total[5m])) == 0 and max(pingwarden_checks{status!="unknown"}) > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Checks are configured but none are being executed"

      - alert: ApiHighErrorRate
        expr: >
          sum(rate(pingwarden_http_requests_total{status=~"5.."}[5m]))
          / sum(rate(pingwarden_http_requests_total[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "More than 5% of API requests fail with 5xx"

  - name: pingwarden-targets
    rules:
      - alert: MonitoredTargetDown
        expr: max(pingwarden_checks{status="down"}) > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "At least one monitored target is DOWN"
image:
  repository: ghcr.io/smokeguap/pingwarden
  tag: ""
  pullPolicy: IfNotPresent

secretName: pingwarden-secrets

config:
  ALERT_FAILURE_THRESHOLD: "3"
  WORKER_CONCURRENCY: "5"
  RESULTS_KEEP: "100"
  CHECK_TIMEOUT: "10s"

api:
  replicas: 1
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 64Mi }

scheduler:
  replicas: 1
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 48Mi }

worker:
  replicas: 1
  resources:
    requests: { cpu: 10m, memory: 24Mi }
    limits: { memory: 64Mi }

notifier:
  replicas: 1
  resources:
    requests: { cpu: 5m, memory: 12Mi }
    limits: { memory: 32Mi }

postgres:
  storage: 2Gi
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { memory: 192Mi }

redis:
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 48Mi }

ingress:
  enabled: false
  host: pingwarden.duckdns.org

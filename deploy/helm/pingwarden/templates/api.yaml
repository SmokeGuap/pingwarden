apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "pingwarden.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: metrics, port: 9090, targetPort: metrics }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "pingwarden.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "pingwarden.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      securityContext: {{- include "pingwarden.podSecurity" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "pingwarden.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/api"]
          ports:
            - { name: http, containerPort: 8080 }
            - { name: metrics, containerPort: 9090 }
          env: {{- include "pingwarden.env" . | nindent 12 }}
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: API_TOKEN
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext: {{- include "pingwarden.containerSecurity" . | nindent 12 }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}